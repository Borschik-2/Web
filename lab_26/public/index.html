<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клієнт Express API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Управління продуктами (Express API)</h1>
    
    <div class="controls">
        <button id="btn-get">1. Отримати список (GET)</button>
        <button id="btn-post">2. Створити продукт (POST)</button>
        <button id="btn-put">3. Оновити ціну (PUT)</button>
        <button id="btn-delete">4. Видалити продукт (DELETE)</button>
    </div>

    <h2>Результат відповіді сервера:</h2>
    <pre id="output">Натисніть кнопку, щоб відправити запит...</pre>

    <script src="client.js"></script>
</body>
</html>
