<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 3</title>
    <link rel="stylesheet" href="task3.css">
</head>
<body>
    <div class="dropdown-container">
        <!-- Перший список (Країни) -->
        <select name="country" id="country">
            <option value="ger">Germany</option>
            <option value="usa" selected>USA</option> <!-- Зробимо USA вибраним за замовчуванням, як на скріншоті -->
            <option value="ukr">Ukraine</option>
        </select>

        <!-- Другий список (Міста) - порожній, заповниться через JS -->
        <select name="cities" id="cities"></select>
    </div>
    
    <!-- Абзац для виведення результату -->
    <p id="result-text"></p>

    <script src="task3.js"></script>
</body>
