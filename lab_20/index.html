<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №20</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Завдання 4: Кнопка для відкриття модального вікна -->
    <div class="container">
        <button id="open-register-btn" class="open-btn">Відкрити вікно реєстрації</button>
    </div>

    <!-- Завдання 4: Модальне вікно (оверлей та сама форма) -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-window">
            
            <!-- Кнопка закриття [x] -->
            <button id="close-modal-btn" class="close-btn">×</button>
            
            <!-- Форма реєстрації -->
            <form id="register-form" class="modal-form">
                <div class="form-group">
                    <label for="nickname">Нікнейм:</label>
                    <input type="text" id="nickname" required>
                </div>

                <div class="form-group">
                    <label for="email">Електронна адреса:</label>
                    <!-- Використовуємо type="email" для первинної HTML5-валідації -->
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Підтвердження пароля:</label>
                    <input type="password" id="confirm-password" required>
                </div>

                <button type="submit" class="submit-btn">Зареєструватися</button>
            </form>

        </div>
    </div>

    <p style="padding: 20px;"><em>* Результати виконання завдань 1, 2 та 3 перевіряй у консолі розробника (F12 -> Console).</em></p>

    <!-- Підключаємо скрипти -->
    <script src="task1.js"></script>
    <script src="task2.js"></script>
    <script src="task3.js"></script>
    <script src="task4.js"></script>
</body>
</html>
