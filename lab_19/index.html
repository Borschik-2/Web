<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №19</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Завдання 1: Верхня частина сайту (header) -->
    <header class="header">
        <div class="header-container">
            <h1 class="logo">eShop</h1>
            <button id="open-modal-btn" class="create-btn">create Product</button>
        </div>
    </header>

    <!-- Завдання 2: Оверлей та модальне вікно -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-window">
            
            <!-- Шапка модального вікна -->
            <div class="modal-header">
                <h2>Create product</h2>
                <button id="close-modal-btn" class="close-btn">×</button>
            </div>

            <!-- Форма створення продукту -->
            <form id="product-form" class="modal-form">
                
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="description">Description:</label>
                    <!-- Використовуємо textarea для опису -->
                    <textarea id="description" name="description" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="price">Price:</label>
                    <!-- type="number" та min="0" не дозволяють вводити від'ємні значення на рівні HTML -->
                    <input type="number" id="price" name="price" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="discount">Discount:</label>
                    <input type="number" id="discount" name="discount" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="in-stock">In stock:</label>
                    <input type="number" id="in-stock" name="in-stock" min="0" required>
                </div>

                <div class="form-group">
                    <label for="brand">Brand:</label>
                    <input type="text" id="brand" name="brand" required>
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category" required>
                        <option value="smartphones">Smartphones</option>
                        <option value="laptops">Laptops</option>
                        <option value="fragrances">Fragrances</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="picture-link">Link to picture:</label>
                    <!-- type="url" перевіряє правильність формату посилання -->
                    <input type="url" id="picture-link" name="picture-link" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="save-btn">Save Product</button>
                </div>
            </form>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
